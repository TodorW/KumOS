set timeout=3
set default=0

insmod all_video
insmod gfxterm
insmod png

set gfxmode=1024x768
terminal_output gfxterm

set theme=/boot/grub/themes/kumos/theme.txt

menuentry "KumOS 1.0" --class kumos {
    multiboot /boot/kumos.bin
    boot
}

menuentry "KumOS 1.0 (debug)" --class debug {
    multiboot /boot/kumos.bin debug
    boot
}
